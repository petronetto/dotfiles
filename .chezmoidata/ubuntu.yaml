ubuntu:
  schema: 1
  release: "26.04"
  architecture: amd64
  # These are dependency packages, not additional selected end-user tools.
  system_packages:
    - ca-certificates
    - gnupg
    - tar
    - libarchive-tools
    - 7zip
    - unzip
    - xz-utils
    - locales
    - fontconfig
    - wl-clipboard
    - xclip
  repositories:
    - id: onepassword
      url: https://downloads.1password.com/linux/debian/amd64
      key_url: https://downloads.1password.com/linux/keys/1password.asc
      key_format: armored
      keyring_path: /usr/share/keyrings/1password-archive-keyring.gpg
      sources_path: /etc/apt/sources.list.d/1password.sources
      fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
      suite: stable
      components: main
      debsig_policy_url: https://downloads.1password.com/linux/debian/debsig/1password.pol
    - id: brave
      url: https://brave-browser-apt-release.s3.brave.com
      key_url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
      key_format: binary
      keyring_path: /usr/share/keyrings/brave-browser-archive-keyring.gpg
      sources_path: /etc/apt/sources.list.d/brave-browser-release.sources
      suite: stable
      components: main
    - id: docker
      url: https://download.docker.com/linux/ubuntu
      key_url: https://download.docker.com/linux/ubuntu/gpg
      key_format: armored
      keyring_path: /etc/apt/keyrings/docker.asc
      sources_path: /etc/apt/sources.list.d/docker.sources
      fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
      suite: resolute
      components: stable
  # Versions below are selected upstream releases, not acceptance-test evidence.
  # Provisioning records resolved versions and verification in the target home.
  tools:
    - id: zsh
      owner: apt
      packages: [zsh]
      commands: [zsh]
    - id: git
      owner: apt
      packages: [git]
      commands: [git]
    - id: curl
      owner: apt
      packages: [curl]
      commands: [curl]
    - id: jq
      owner: apt
      packages: [jq]
      commands: [jq]
    - id: ghostty
      owner: apt
      packages: [ghostty]
      commands: [ghostty]
    - id: ripgrep
      owner: apt
      packages: [ripgrep]
      commands: [rg]
    - id: fd
      owner: apt
      packages: [fd-find]
      commands: [fd]
      compatibility_binary: fdfind
    - id: bat
      owner: apt
      packages: [bat]
      commands: [bat]
      compatibility_binary: batcat
    - id: fzf
      owner: apt
      packages: [fzf]
      commands: [fzf]
    - id: zoxide
      owner: apt
      packages: [zoxide]
      commands: [zoxide]
    - id: lsd
      owner: apt
      packages: [lsd]
      commands: [lsd]
    - id: delta
      owner: apt
      packages: [git-delta]
      commands: [delta]
    - id: atuin
      owner: apt
      packages: [atuin]
      commands: [atuin]
    - id: tmux
      owner: apt
      packages: [tmux]
      commands: [tmux]
    - id: neovim
      owner: apt
      packages: [neovim]
      commands: [nvim]
    - id: chezmoi
      owner: bootstrap
      commands: [chezmoi]
      source: https://get.chezmoi.io
      verification: official-installer
    - id: mise
      owner: upstream
      commands: [mise]
      version: "2026.10.18"
      format: binary
      url: https://github.com/jdx/mise/releases/download/v2026.10.18/mise-v2026.10.18-linux-x64
      sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
      verification: sha256
      provenance: https://api.github.com/repos/jdx/mise/releases/tags/v2026.10.18
    - id: node
      owner: mise
      commands: [node, npm, npx]
      version: "24.22.1"
      source: https://nodejs.org/dist/v24.22.1/
      verification: mise-node-checksums
    - id: starship
      owner: upstream
      commands: [starship]
      version: "1.27.0"
      format: tar.gz
      url: https://github.com/starship/starship/releases/download/v1.27.0/starship-x86_64-unknown-linux-gnu.tar.gz
      sha256: 3b94758850901717eb36aa1b53f8492c1322506ec6d41273bc6151e79ed8e4a1
      verification: sha256
      provenance: https://api.github.com/repos/starship/starship/releases/tags/v1.27.0
    - id: herdr
      owner: upstream
      commands: [herdr]
      version: "0.9.5"
      format: binary
