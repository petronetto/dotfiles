      sha256: 14d9e8bc8b4a9e0118d77c32266f76d461f09b40342eb23752960bd89f59929d
      verification: sha256
      provenance: https://herdr.dev/latest.json
    - id: ast-grep
      owner: upstream
      commands: [ast-grep]
      version: "0.51.0"
      format: zip
      url: https://github.com/ast-grep/ast-grep/releases/download/0.51.0/app-x86_64-unknown-linux-gnu.zip
      sha256: a7eead5552d3a8daad70f5d50d935da44bd0c138e946b5b0a96b1d38169fa639
      verification: sha256
      provenance: https://api.github.com/repos/ast-grep/ast-grep/releases/tags/0.51.0
    - id: pi
      owner: npm
      commands: [pi]
      package: "@earendil-works/pi-coding-agent"
      version: "1.4.0"
      source: https://pi.dev/
      verification: npm-integrity
    - id: onepassword
      owner: vendor-apt
      repository: onepassword
      packages: [1password]
      commands: [1password]
    - id: op
      owner: vendor-apt
      repository: onepassword
      packages: [1password-cli]
      commands: [op]
    - id: brave
      owner: vendor-apt
      repository: brave
      packages: [brave-browser]
      commands: [brave-browser]
    - id: obsidian
      owner: upstream
      commands: [obsidian]
      version: "1.14.5"
      format: deb
      url: https://github.com/obsidianmd/obsidian-releases/releases/download/v1.14.5/obsidian_1.14.5_amd64.deb
      sha256: c37fb46a966f604823337fb36ab23bd1baf8ce912ec35af59d62358a93357bee
      verification: sha256
      provenance: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/tags/v1.14.5
    - id: zed
      owner: upstream
      commands: [zed]
      dependencies: [libasound2t64, libvulkan1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libxcb1]
      version: "1.25.3"
      format: tar.gz
