      provenance: https://api.github.com/repos/zed-industries/zed/releases/tags/v1.25.3
    - id: todoist
      owner: upstream
      commands: [todoist]
      dependencies: [libgtk-3-0t64, libnss3, libxss1, libasound2t64, libgbm1, libnotify4, libsecret-1-0]
      version: "9.31.0"
      format: appimage
      url: https://electron-dl.todoist.net/linux/Todoist-linux-9.31.0-x86_64-latest.AppImage
      verification: https-only
      provenance: https://www.todoist.com/downloads/linux
    - id: td
      owner: npm
      commands: [td]
      package: "@doist/todoist-cli"
      version: "5.8.0"
      source: https://www.todoist.com/cli
      verification: npm-integrity
    - id: docker
      owner: vendor-apt
      repository: docker
      packages: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
      commands: [docker, "docker compose", "docker buildx"]
  fonts:
    - id: JetBrainsMono
      family: JetBrainsMono NFM
      version: "3.5.1"
      url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz
      sha256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf
      provenance: https://api.github.com/repos/ryanoasis/nerd-fonts/releases/tags/v3.5.1
    - id: CascadiaCode
      family: CaskaydiaCove Nerd Font
      version: "3.5.1"
      url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/CascadiaCode.tar.xz
      sha256: ae598e9401e2846aa3ee364513715de0490b844a4b54f0768991f45f23aa8369
      provenance: https://api.github.com/repos/ryanoasis/nerd-fonts/releases/tags/v3.5.1
