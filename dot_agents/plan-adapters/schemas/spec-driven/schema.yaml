name: spec-driven
version: 1
description: Default change workflow - proposal, specs, design, tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.
      Use ASD-STE100 Simplified Technical English. Define necessary terms at
      first use. Use ASCII only in diagrams and no em or en dashes.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **Goals**: Concrete observable results with IDs G1, G2. Link each goal to its requirement names and paths, or to preservation checks. A word such as "fast" needs a number or a check.
      - **Excluded Work**: Related work that is outside this change. Keep problem, goals, and exclusions concrete.
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing capability path in the configured main-spec catalog. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      use `plan-cli list` to find the reserved `specs` catalog location, then
      `plan-cli files <specs-location>` for the capability inventory. Read each
      related `<capability-path>/spec.md` through `plan-cli read`, including all
      scenarios, before deciding what is covered or what should change.
      The ordinary task list is not the capability inventory. Reuse an existing
      capability's exact path instead of introducing a near-duplicate name.
      Each capability listed here will need a corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or explicitly opt out of specs: a change with zero deltas is
      invalid unless its `.change.yaml` sets `skip_specs: true`. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.
      For a pure refactor, set `skip_specs: true`. The proposal states
      `No behavior change`, names the preserved behavior, and names the
      checks that prove it. Do not create spec outputs for that change.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.
      Read ../../../references/writing-specs.md relative to this schema.
      Use standard technical English, complete sentences, and enough context
      for a reader who has not seen the code. Do not impose controlled-language
      or sentence-length limits. Use ASCII only in diagrams and no em or en dashes.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing `<capability-path>` from the main-spec catalog when creating the delta at `specs/<capability-path>/spec.md`. Use `plan-cli files <specs-location>` to confirm that path before writing the delta. A mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Do not rewrite
        an existing file unless the user asks you to.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it. Do not plan every file
        before writing the first.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.change.yaml`
      sets `skip_specs: true` (no spec-level behavior change). A zero-delta
      change without that marker is invalid. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by a `Goal: G1` line and description. Link the goal to proposal.md.
      - Each requirement defines one observable behavior: state the actor, condition, result, and relevant limits, with no implementation detail.
      - Use SHALL or MUST for required behavior, SHALL NOT or MUST NOT for forbidden behavior (avoid should/may).
      - Requirement and scenario names are the stable IDs. Add no numeric IDs. Rename only through RENAMED with FROM:/TO: mappings; qualify scenario mappings with their parent requirement.
      - Each scenario: `#### Scenario: <name>` with GIVEN, WHEN, THEN, and AND for related conditions or outcomes. Exercise the requirement with concrete inputs and results, rather than restating it. Cover important error and boundary cases.
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every ADDED or MODIFIED requirement MUST have at least one scenario. REMOVED uses Reason/Migration and RENAMED uses FROM:/TO:, with baseline checks rather than invented scenarios.
      - Preserve complete updated MODIFIED blocks and all unchanged guarantees. Never trim context to meet an arbitrary length limit.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters; shorter text is too brief under
      strict validation) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      use `plan-cli read <specs-location> <capability-path>/spec.md`, then
      `plan-cli write` with the full revised file. Resolve `<specs-location>`
      from `plan-cli list`, never from a repository-relative path. A baseline
      Purpose edit requires authorization for that catalog file; do not
      expand a change-only write scope silently.

      MODIFIED requirements workflow:
      1. Locate the existing requirement with `plan-cli read <specs-location> <capability-path>/spec.md`
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      Goal: G1 (proposal.md#goals).
      The system SHALL allow an authenticated user to download their own data in CSV format, excluding other users' data.

      #### Scenario: Successful export
      - **GIVEN** an authenticated user with saved data
      - **WHEN** the user selects "Export"
      - **THEN** the system downloads a CSV file with that user's data
      - **AND** the file contains no other user's data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      Goal: G1 (proposal.md#goals).
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change.
      Use ASD-STE100 Simplified Technical English and define necessary terms
      at first use. Use ASCII only in diagrams and no em or en dashes.

      When to include design.md (create only if any apply):
      - Cross-cutting change (multiple services/modules) or new architectural pattern
      - New external dependency or significant data model changes
      - Security, performance, or migration complexity
      - Ambiguity that benefits from technical decisions before coding

      Sections:
      - **Context**: Only the current state and constraints needed to explain the approach. Reference the proposal for motivation instead of restating it (e.g., "See proposal.md - Why").
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes. Don't restate the proposal's scope - add only design-level boundaries.
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] -> Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Unknowns that can safely be answered later without
        changing the specs, the approach, or the task breakdown. Omit if none.

      Open questions are for genuinely deferrable unknowns, not decisions you
      skipped. If a question would change the specs, the chosen approach, or
      the task breakdown, resolve it now - ask the user instead of guessing.

      Focus on architecture and approach, not line-by-line implementation.
      The proposal covers why and what; design covers how. Reference the
      proposal for motivation and, once written, the specs for requirements -
      if a section would only restate them, point to them instead.

      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      Before writing tasks, check design.md for Open Questions. If any of them
      would change what gets built, resolve them with the user first - do not
      bake an unstated assumption into the task list.

      **IMPORTANT: Follow the template below for tracked tasks.** The apply phase parses
      checkbox format to track progress. A box holding only `x` counts as done,
      upper or lower case and with any spacing, so `- [ x]` is done too. Every
      other marker, including `- [~]`, `- [-]` and an empty `- []`, reads as
      unfinished. A line with no checkbox is not tracked at all.

      Read ../../../references/writing-tasks.md relative to this schema.
      Use ASD-STE100 Simplified Technical English. Define necessary terms at
      first use. Use ASCII only in diagrams and no em or en dashes.

      Guidelines:
      - Each task group has one responsibility, can be reviewed and reverted alone, and leaves the code working.
      - Use descriptive ## group headings, without numeric IDs. Do not invent groups to fill the list or add groups that only create unused structures.
      - Each group has a plain `Depends:` line (not a checkbox): `Depends: none` or exact prerequisite group names. Dependencies must exist and be acyclic. Order dependencies first; independent groups with disjoint files can run in parallel.
      - Each tracked task MUST be a checkbox: `- [ ] Verb ...`. Start with a verb, use one action, name its files, and name its requirement and scenario or preservation check.
      - Tasks should be small enough to complete in one session.
      - Cover all requirements and scenarios, including removal/rename baseline checks. For pure refactors, link to the proposal's preservation checks. Checks cover the Definition of Done, not only local acceptance criteria.
      - State each fact once. Link to behavior and decisions rather than copying them. Get exact verification commands from stack discovery; do not add a separate command inventory.
      - Stay inside CHARTER.md boundaries and project instructions. Resolve material uncertainty before writing tasks; record minor assumptions in the relevant artifact.
      - Track implementation and verification work that can be completed before
        archive. If the requested workflow includes archive or work that requires
        this change to be archived, preserve those steps as plain bullets in an
        optional `## Workflow follow-up` section at the end of tasks.md. These
        bullets are reference information outside tracked task progress.
      - Each task MUST state how to verify completion (a test, command,
        observable behavior, or delivered artifact). Put the verification in
        that task's checkbox description. Use a separate verification task only
        when it checks broader integration or system behavior that spans
        multiple implementation tasks.
      - Each task group MUST land the tests and documentation its own work
        calls for. Do NOT collect testing or documentation into a final group -
        when a late group first exercises work from an early one, the failures
        cascade back through every group in between and force rework. A group
        whose working change calls for neither carries neither. A final group is for integration checks only, not for
        the tests and docs an earlier group owed.

      Example:
      ```
      # Tasks

      ## Data export

      Depends: none

      - [ ] Implement CSV export in src/export.ts for "User can export data"; check: "Successful export" passes in tests/export.test.ts.
      - [ ] Test export isolation in tests/export.test.ts for "User can export data"; check: another user's data is excluded.
      - [ ] Document CSV export in docs/export.md for "Successful export"; check: the example returns the specified file.
      ```

      When applicable, append workflow follow-up as plain bullets, for example:
      ```
      ## Workflow follow-up

      - Archive the change after the project's review requirements are satisfied.
      - Verify the archived result.
      ```

      Reference specs for what needs to be built, design for how to build it.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Read context files and work through pending task groups in dependency order.
    Mark tasks complete as you go. Use build's explicit approval after each
    group, or build-auto's independent reviewer gate when authorized.
    Pause if you hit blockers or need clarification. Run the shared final
    audit before declaring done.
