# ===========================
# Tmux Configuration
# ===========================

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -ga terminal-overrides ",*:RGB"

# Enable mouse support
set -g mouse on

# Extended key mode
set -g extended-keys on
set -g extended-keys-format csi-u

# Allow passthrough for terminal features (e.g., clickable URLs in Ghostty)
set -g allow-passthrough on

# Enable system clipboard integration
set -g set-clipboard on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Enable focus events
set -g focus-events on

# Faster command sequences
set -s escape-time 0

# Cursor style configuration
set -g cursor-style blinking-bar

# ===========================
# Key Bindings
# ===========================
#
# Prefix is F4 (fn key, remapped at the HID level to F4 by
# run_once_after_remap-fn-to-f4.sh.tmpl). C-a works as a secondary prefix.
# All bindings below are prefixed (F4 <key>), not direct Option-key
# bindings.
#
# Pane Management:
#   F4 =             Split pane vertically (right)
#   F4 -             Split pane horizontally (down)
#   F4 q             Close current pane
#   F4 h/j/k/l       Navigate between panes (vim-style)
#
# Window Management:
#   F4 w             New window
#   F4 [             Previous window
#   F4 ]             Next window
#   F4 {             Move window left
#   F4 }             Move window right
#
# Session Management:
#   F4 s             Session manager
#   F4 d             Detach session
#
# Other:
#   F4 p             Command mode
#   F4 r             Reload configuration
#   F4 Space         Toggle floax popup
#
# ===========================

# Prefix is F4, with C-a as a secondary prefix
set -g prefix F4
set -g prefix2 C-a
# F4 pressed again while in prefix mode: silent no-op. Do NOT use
# send-prefix here — on fn auto-repeat it injects the F4 sequence
# (ESC O S) into the pane, leaking garbage (e.g. "S" + newline in vim).
bind-key F4 run-shell -b "true"
bind-key C-a send-prefix -2

# F4 =: Split pane vertically (right)
bind-key = split-window -h -c "#{pane_current_path}"

# F4 -: Split pane horizontally (down)
bind-key - split-window -v -c "#{pane_current_path}"

# F4 w: New window
bind-key w new-window -c "#{pane_current_path}"

# F4 q: Close current pane (without confirmation)
bind-key q kill-pane

# F4 h/j/k/l: Vi-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# F4 [ and F4 ]: Navigate between windows
bind-key "[" previous-window
bind-key "]" next-window

# F4 { and F4 }: Move windows left and right
bind-key "{" swap-window -t -1 \; select-window -t -1
bind-key "}" swap-window -t +1 \; select-window -t +1

# F4 p: Open tmux command mode
bind-key p command-prompt

# F4 r: Reload configuration
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Easy resizing of panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# F4 d: Detach session
bind-key d detach-client

# F4 s: Open native session manager
bind-key s choose-tree -Zs

# ===========================
# Copy Mode (Vi-style)
# ===========================

setw -g mode-keys vi

# Disable automatic copy on mouse drag end - just select the text
unbind -T copy-mode-vi MouseDragEnd1Pane

# Mouse selection enters copy mode and selects text without copying
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Vi-style selection and copy
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Enter copy mode with mouse scroll in normal mode
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# Status bar position
set -g status-position bottom
set -g status-justify left

# Status bar style - Gruvbox dark background
set -g status-style "bg=black,fg=colour7"
set -g status-left-length 20
set -g status-right-length 50

# Left side: empty (windows start from left)
set -g status-left "#[bg=colour2,fg=colour0,bold] 󰓩 "

# Right side: session name with Gruvbox blue accentß
set -g status-right "#[bg=colour1,fg=colour0,bold]  #[bg=colour4,fg=colour0,bold] #S "

# Window status format - inactive muted, active with Gruvbox yellow
set -g window-status-format "#[bg=brightblack,fg=white]  #W #[bg=default] "
set -g window-status-current-format "#[bg=colour10,fg=colour0,bold]  #W #[bg=default] "
set -g window-status-separator ""

# Pane border colors - Gruvbox gray and aqua
set -g pane-border-style "fg=colour0"
set -g pane-active-border-style "fg=colour6"

# Message style - Gruvbox yellow
set -g message-style "bg=colour3,fg=colour0,bold"
set -g message-command-style "bg=colour3,fg=colour0,bold"

# Mode style (copy mode, etc.) - Gruvbox blue
set -g mode-style "bg=colour4,fg=colour15"

# ===========================
# Plugins
# ===========================

# TPM - Tmux Plugin Manager
# Press prefix + I to install plugins
# Press prefix + U to update plugins
# Press prefix + alt + u to uninstall plugins not in the list

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-floax'

# ===========================
# Plugin Configuration
# ===========================

# Tmux-yank configuration
# Enable clipboard integration with macOS
set -g @yank_action 'copy-pipe-no-clear'
set -g @yank_selection 'primary'
set -g @yank_selection_mouse 'clipboard'
# Use pbcopy for macOS clipboard
set -g @override_copy_command 'pbcopy'

# Floax configuration
set -g @floax-bind 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'

# F4 Space: Open floax
bind-key Space run-shell "$HOME/.local/share/tmux/plugins/tmux-floax/scripts/floax.sh"

# Initialize TMUX plugin manager (keep this line at the very bottom)
# Uses XDG Base Directory specification
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
run "$HOME/.local/share/tmux/plugins/tpm/tpm"
