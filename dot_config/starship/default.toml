"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
continuation_prompt = "[▸▹ ](dimmed white)"

format = """
$directory \
$character"""

right_format = """
$git_branch\
$git_commit\
$git_state\
$git_status\
$docker_context\
$package\
$golang\
$kotlin\
$lua\
$nodejs\
$php\
$pulumi\
$python\
$rust\
$terraform\
$memory_usage\
$aws\
$custom\
$status\
$os\
$battery\
$time"""

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[❯](bold yellow)"
error_symbol = "[χ](purple)"
vimcmd_symbol = "[❮](dimmed green)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "blue"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)'

[directory.substitutions]
'/opt/code' = '△ code'

[cmd_duration]
format = "[◄ $duration ](white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "dimmed white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 60
style = "dimmed bright-purple"

[[battery.display]]
threshold = 70
style = "dimmed yellow"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](bold blue)"
style = "blue"
truncation_symbol = "⋯"
truncation_length = 25
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'dimmed green'
deleted_style = 'dimmed red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold blue"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](magenta)"
ahead = "[▴│[${count}](bold white)│](green)"
behind = "[▿│[${count}](bold white)│](red)"
diverged = "[◇ ▴┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](magenta)"
untracked = "[◌◦](yellow)"
stashed = "[◃◈](white)"
modified = "[●◦](yellow)"
staged = "[▪┤[$count](bold white)│](cyan)"
renamed = "[◎◦](blue)"
deleted = "[✕](red)"

[deno]
format = " [deno](italic) [∫ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = "⨀ "
style = "bold yellow"

[php]
format = " [php](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
detect_files = ["composer.json"]
detect_folders = ["vendor"]
detect_extensions = [ ".php" ]

[nodejs]
format = " [node](italic) [◫ ($version)](bold green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = "[⌉](bold blue)⌊ "
version_format = "${raw}"
style = "bold yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "⊃ "
version_format = "${raw}"
style = "bold red"

[package]
format = " [pkg](dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = "◁ "
style = "bold red"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = "▲ "

[docker_context]
symbol = "◧ "
format = " docker [$symbol$context]($style)"

[golang]
symbol = "∩ "
format = " go [$symbol($version )]($style)"

[memory_usage]
symbol = "▪▫▪ "
format = " mem [${ram}( ${swap})]($style)"
