services:
  ubuntu-dotfiles-test:
    platform: linux/amd64
    image: ubuntu-dotfiles-test:26.04
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${UBUNTU_TEST_BASE_IMAGE:-ubuntu:26.04}
    container_name: ubuntu-dotfiles-test
    user: tester
    init: true
    restart: unless-stopped
    labels:
      dotfiles.source-digest: ${UBUNTU_TEST_SOURCE_DIGEST:-unprepared}
